[package]
name = "mystrix-pro"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true


[[bin]]
name = "mystrix-pro"
path = "src/main.rs"
test = false
bench = false

[dependencies]
firmware-core = { path = "../../core", features = ["pressure-sensitive", "rgb-color", "launchpad-pro", "mystrix-pro"] }

[target.'cfg(target_arch = "xtensa")'.dependencies]
critical-section = "1.2.0"
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-storage = "0.3.1"
esp-backtrace = { version = "0.19.0", features = ["esp32s3", "panic-handler", "println"] }
esp-hal = { version = "=1.1.1", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy"] }
esp-storage = { version = "0.9.0", features = ["esp32s3"] }
heapless = "0.9.3"
static_cell = "2.1.1"


