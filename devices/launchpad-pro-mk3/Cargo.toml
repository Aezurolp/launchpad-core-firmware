[package]
name = "launchpad-pro-mk3"
edition.workspace = true
version.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "launchpad-pro-mk3"
path = "src/main.rs"
test = false
bench = false

[dependencies]
firmware-core = { path = "../../core", features = ["pressure-sensitive", "rgb-color", "launchpad-pro-mk3"] }
cortex-m.workspace = true
cortex-m-rt = { workspace = true, features = ["set-sp", "set-vtor"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-embedded-hal = "0.6.0"
embassy-stm32 = { version = "0.6.0", features = ["time-driver-tim4", "stm32f745ve", "exti"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embedded-hal-nb = "1.0.0"
static_cell = "2.1.1"
panic-halt = "1.0.0"
stm32-metapac = { version = "21.0.0", features = ["stm32f745ve"] }
embassy-futures = "0.1.2"
embassy-usb = "0.6.0"
heapless = "0.9.3"
