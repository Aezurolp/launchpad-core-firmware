[package]
name = "launchpad-mk2"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "launchpad-mk2"
path = "src/main.rs"
test = false
bench = false

[dependencies]
firmware-core = { path = "../../core", features = ["no-setup-btn", "rgb-color", "launchpad-mk2"] }
# NOTE: deliberately NOT using the workspace `cortex-m` (which enables
# `critical-section-single-core`). This target provides its own BASEPRI-based
# `critical-section` implementation (see `leds::ScanPriorityCriticalSection`)
# that reserves NVIC priority 0 for the jitter-sensitive LED scan, so the stock
# PRIMASK single-core impl must be kept out of the build to avoid a duplicate
# `critical-section` provider.
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
critical-section = { version = "1.2", features = ["restore-state-u8"] }
cortex-m-rt = { workspace = true, features = ["set-sp", "set-vtor"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["time-driver-tim4", "stm32f103rb", "exti"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
heapless = "0.9.3"
static_cell = "2.1.1"
panic-halt = "1.0.0"
